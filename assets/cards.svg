<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-label="dsh-feishu 三张卡片结构：目标、高危确认、提问">
  <rect width="1440" height="560" fill="#16181d"/>
  <text x="48" y="42" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13" letter-spacing="1.4">CARD STRUCTURE / 卡片结构，按真实 JSON 画，不是飞书截图</text>

  <!-- Goal -->
  <g transform="translate(48,64)">
    <rect width="416" height="448" rx="10" fill="#1e2229" stroke="#2c323b"/>
    <rect width="416" height="48" rx="10" fill="#1a3a4a"/>
    <rect y="28" width="416" height="20" fill="#1a3a4a"/>
    <text x="20" y="31" fill="#7ec8c3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="15" font-weight="600">目标 · 进行中</text>
    <text x="20" y="84" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="14">把 README 补上安装步骤</text>
    <text x="20" y="110" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">轮次 1/3 · 已武装，会自动续轮</text>
    <text x="20" y="136" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">可修改、暂停，或清除</text>
    <line x1="20" y1="160" x2="396" y2="160" stroke="#2c323b"/>
    <text x="20" y="188" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="12">目标</text>
    <rect x="20" y="200" width="376" height="88" rx="6" fill="#16181d" stroke="#2c323b"/>
    <text x="32" y="226" fill="#5c636d" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">填写新目标后点保存修改</text>
    <rect x="20" y="304" width="120" height="36" rx="6" fill="#3370ff"/>
    <text x="36" y="327" fill="#f4f6f8" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">保存修改</text>
    <rect x="20" y="360" width="116" height="36" rx="6" fill="#16181d" stroke="#3d4550"/>
    <text x="44" y="383" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">暂停续跑</text>
    <rect x="148" y="360" width="88" height="36" rx="6" fill="#16181d" stroke="#3d4550"/>
    <text x="172" y="383" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">清除</text>
    <text x="20" y="428" fill="#5c636d" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="12">完成变绿 · 阻塞变红 · 原地改</text>
  </g>

  <!-- Approval -->
  <g transform="translate(512,64)">
    <rect width="416" height="448" rx="10" fill="#1e2229" stroke="#2c323b"/>
    <rect width="416" height="48" rx="10" fill="#4a2d16"/>
    <rect y="28" width="416" height="20" fill="#4a2d16"/>
    <text x="20" y="31" fill="#f0b27a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="15" font-weight="600">高危操作待确认</text>
    <text x="20" y="84" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="14">模型想执行下面这条命令。</text>
    <text x="20" y="110" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">原因：unnamed-rm</text>
    <rect x="20" y="136" width="376" height="148" rx="6" fill="#16181d" stroke="#2c323b"/>
    <text x="36" y="166" fill="#7ec8c3" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">rm -rf /tmp/build-cache</text>
    <text x="36" y="190" fill="#5c636d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13"># 未点名路径，挂起等确认</text>
    <rect x="20" y="312" width="88" height="36" rx="6" fill="#16181d" stroke="#3d4550"/>
    <text x="44" y="335" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">拒绝</text>
    <rect x="120" y="312" width="120" height="36" rx="6" fill="#c45c26"/>
    <text x="136" y="335" fill="#f4f6f8" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">允许这一次</text>
    <text x="20" y="388" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">打字同意不算批准。</text>
    <text x="20" y="412" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">须订 card.action.trigger</text>
  </g>

  <!-- Ask -->
  <g transform="translate(976,64)">
    <rect width="416" height="448" rx="10" fill="#1e2229" stroke="#2c323b"/>
    <rect width="416" height="48" rx="10" fill="#1b3358"/>
    <rect y="28" width="416" height="20" fill="#1b3358"/>
    <text x="20" y="31" fill="#8eb4ff" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="15" font-weight="600">需要选择</text>
    <text x="20" y="84" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="14">这次提交范围怎么定？</text>
    <text x="20" y="110" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">也可在下方填写，或直接打字。先到的算数。</text>
    <rect x="20" y="136" width="180" height="36" rx="6" fill="#3370ff"/>
    <text x="44" y="159" fill="#f4f6f8" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">提交并 push</text>
    <rect x="212" y="136" width="164" height="36" rx="6" fill="#16181d" stroke="#3d4550"/>
    <text x="236" y="159" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">只 commit</text>
    <rect x="20" y="184" width="164" height="36" rx="6" fill="#16181d" stroke="#3d4550"/>
    <text x="52" y="207" fill="#c5cbd3" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">先不动 git</text>
    <text x="20" y="248" fill="#8b919a" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="12">回答</text>
    <rect x="20" y="260" width="376" height="72" rx="6" fill="#16181d" stroke="#2c323b"/>
    <text x="32" y="286" fill="#5c636d" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">填写回答后点「提交回答」</text>
    <rect x="20" y="348" width="120" height="36" rx="6" fill="#3370ff"/>
    <text x="36" y="371" fill="#f4f6f8" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="13">提交回答</text>
    <text x="20" y="416" fill="#5c636d" font-family="IBM Plex Sans, Noto Sans SC, sans-serif" font-size="12">ask_user_question</text>
  </g>
</svg>
