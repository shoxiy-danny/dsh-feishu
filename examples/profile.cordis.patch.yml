# Copy these rows into ~/.dsh/profiles/feishu/cordis.patch.yml
# after `dsh plugin --profile feishu add ...`.
# Later layers replace a whole config object, they do not deep-merge.
# Field-by-field meaning: docs/handbook.md 模型.

# Optional: extra providers beyond DeepSeek official.
# Keys stay in the environment; never put secrets in this file.

# Catalog route (key is a name dsh/pi-ai already ships): inherit protocol,
# endpoint, and model list. Often only apiKeyEnv is required.
#
# - id: llm-pi-ai
#   config:
#     providers:
#       openai:
#         apiKeyEnv: OPENAI_API_KEY
#       anthropic:
#         apiKeyEnv: ANTHROPIC_API_KEY

# Hand-declared route (key is a name you invent): api + baseURL + models
# are all required. One route, one protocol.
#
# - id: llm-pi-ai
#   config:
#     providers:
#       my-gateway:
#         displayName: My Gateway
#         apiKeyEnv: MY_GATEWAY_KEY
#         api: openai-completions          # or openai-responses / anthropic-messages
#         baseURL: https://gateway.example/v1
#         # reasoning: high
#         # defaultContextWindow: 262144
#         # defaultMaxTokens: 32768
#         # defaultInput: [text]
#         # headers:
#         #   X-Custom: value
#         # streamIdleTimeoutMs: 300000
#         # compat:                         # openai-completions only
#         #   thinkingFormat: openai         # openai / deepseek / openrouter / together / zai / qwen / string-thinking / ant-ling
#         #   supportsReasoningEffort: false
#         models:
#           - id: the-model-id             # must match the vendor model name
#             name: the-model-id
#             contextWindow: 262144
#             # maxTokens: 32768
#             # input: [text]
#             # reasoningEfforts:
#             #   off:
#             #   high: high

# Then point DSH_FEISHU_MODELS at a copy of examples/models.json.
# json.provider = the route key above; json.model = models[].id.

# Optional MCP clients. Only add these if you actually run those servers.
