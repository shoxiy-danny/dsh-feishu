# Copy this file's rows into ~/.dsh/profiles/feishu/cordis.patch.yml
# after `dsh plugin --profile feishu add github:shoxiy-danny/dsh-feishu`.
# Later layers replace a whole config object, they do not deep-merge.
#
# This example adds one unofficial OpenAI-compatible model (`oa` = gpt-4.1).
# Change apiKeyEnv / baseURL / models[].id to match your vendor.
# Pair with examples/models.json: json.provider = route key; json.model = models[].id.
# Keys stay in the environment; never put secrets in this file.

- id: llm-pi-ai
  config:
    providers:
      my-openai:
        displayName: OpenAI-compatible
        apiKeyEnv: MY_OPENAI_KEY
        api: openai-completions
        baseURL: https://api.openai.com/v1
        models:
          - id: gpt-4.1
            name: gpt-4.1
            contextWindow: 1048576
            input: [text, image]

# Catalog route instead of a hand-declared one (key is a name dsh/pi-ai already ships):
# inherit protocol, endpoint, and model list. Often only apiKeyEnv is required.
#
# - id: llm-pi-ai
#   config:
#     providers:
#       openai:
#         apiKeyEnv: OPENAI_API_KEY
#       anthropic:
#         apiKeyEnv: ANTHROPIC_API_KEY

# Then:
#   export DSH_FEISHU_MODELS=/absolute/path/to/examples/models.json
#   export MY_OPENAI_KEY=...
# Restart dsh --profile feishu. /model should list dsf and oa.
